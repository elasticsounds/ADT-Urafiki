  <style>
   .mc-grid{display:grid;grid-template-columns:1fr;gap:1rem;max-width:36rem;margin:0 auto}
   .mc-option{position:relative;cursor:pointer;border-radius:1rem;border:2px solid #111827;background:#FFFAF5;padding:1.25rem 1.5rem;text-align:center;box-shadow:0 6px 0 0 rgba(0,0,0,0.65);transition:all 0.2s ease;user-select:none;-webkit-user-select:none}
   .mc-option:hover:not(.mc-selected):not(.mc-correct):not(.mc-incorrect){transform:translateY(-2px);box-shadow:0 8px 0 0 rgba(0,0,0,0.55)}
   .mc-option:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
   .mc-option.mc-selected{border-color:#1d4ed8;border-width:3px;background-color:rgba(59,130,246,0.12);box-shadow:0 8px 0 rgba(29,78,216,0.35);transform:translateY(-3px)}
   .mc-option.mc-correct{border-color:#16a34a!important;border-width:3px;background-color:rgba(34,197,94,0.12)!important;box-shadow:0 6px 0 0 rgba(22,163,74,0.4)!important;cursor:default}
   .mc-option.mc-incorrect{border-color:#dc2626!important;border-width:3px;background-color:rgba(239,68,68,0.1)!important;box-shadow:0 6px 0 0 rgba(220,38,38,0.3)!important;cursor:default}
   .mc-check{display:none;position:absolute;top:-10px;right:-10px;width:30px;height:30px;border-radius:50%;background:#1d4ed8;color:#fff;align-items:center;justify-content:center;font-size:16px;font-weight:bold}
   .mc-option.mc-selected .mc-check{display:flex}
   .mc-result-icon{display:none;position:absolute;top:-10px;right:-10px;width:30px;height:30px;border-radius:50%;color:#fff;align-items:center;justify-content:center;font-size:16px;font-weight:bold}
   .mc-btn-check{display:inline-block;padding:0.875rem 2.5rem;border-radius:1rem;border:2px solid #111827;background:#2563eb;color:#fff;font-size:1.25rem;font-weight:700;box-shadow:0 6px 0 0 rgba(0,0,0,0.65);cursor:pointer;transition:all 0.2s ease}
   .mc-btn-check:hover{transform:translateY(-2px);box-shadow:0 8px 0 0 rgba(0,0,0,0.55)}
   .mc-btn-check:active{transform:translateY(2px);box-shadow:0 2px 0 0 rgba(0,0,0,0.65)}
   .mc-btn-check:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
   .mc-btn-retry{display:inline-block;padding:0.75rem 2rem;border-radius:1rem;border:2px solid #111827;background:#f59e0b;color:#111827;font-size:1.125rem;font-weight:700;box-shadow:0 6px 0 0 rgba(0,0,0,0.65);cursor:pointer;transition:all 0.2s ease}
   .mc-btn-retry:hover{transform:translateY(-2px);box-shadow:0 8px 0 0 rgba(0,0,0,0.55)}
   .mc-btn-retry:active{transform:translateY(2px);box-shadow:0 2px 0 0 rgba(0,0,0,0.65)}
   .mc-btn-retry:focus-visible{outline:3px solid #fcd34d;outline-offset:2px}
   @keyframes celebrateShake{0%,100%{transform:rotate(0deg) scale(1)}20%{transform:rotate(-3deg) scale(1.02)}40%{transform:rotate(3deg) scale(1.02)}60%{transform:rotate(-2deg) scale(1.01)}80%{transform:rotate(2deg) scale(1.01)}}
   .mc-celebrate{animation:celebrateShake 0.6s ease-in-out}
   @keyframes fadeInUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
   .mc-fade-in{animation:fadeInUp 0.4s ease-out forwards}
  </style>

  <script>
   (function(){document.body.style.backgroundColor='#FFFAF5';var c=document.getElementById('content');if(c){var bg=c.getAttribute('data-background-color');if(bg)c.style.backgroundColor=bg;}})();

  <script>
   (function () {
     var CORRECT = 1;
     var selectedIdx = -1;
     var checked = false;
     var options = document.querySelectorAll('.mc-option');
     var checkBtn = document.getElementById('check-btn');
     var resultArea = document.getElementById('result-area');
     var retryBtn = document.getElementById('retry-btn');
     function selectOption(idx) {
       if (checked) return;
       if (selectedIdx === idx) { selectedIdx = -1; } else { selectedIdx = idx; }
       for (var i = 0; i < options.length; i++) {
         var opt = options[i];
         if (i === selectedIdx) { opt.classList.add('mc-selected'); opt.setAttribute('aria-checked', 'true'); }
         else { opt.classList.remove('mc-selected'); opt.setAttribute('aria-checked', 'false'); }
       }
       if (selectedIdx >= 0) { checkBtn.classList.remove('hidden'); } else { checkBtn.classList.add('hidden'); }
     }
     function check() {
       checked = true;
       for (var i = 0; i < options.length; i++) {
         var opt = options[i];
         var cm = opt.querySelector('.mc-check');
         var ri = opt.querySelector('.mc-result-icon');
         if (cm) cm.style.display = 'none';
         if (i === selectedIdx) {
           opt.classList.remove('mc-selected');
           if (i === CORRECT) { opt.classList.add('mc-correct'); if (ri) { ri.style.display = 'flex'; ri.style.background = '#16a34a'; ri.textContent = '✓'; } }
           else { opt.classList.add('mc-incorrect'); if (ri) { ri.style.display = 'flex'; ri.style.background = '#dc2626'; ri.textContent = '✗'; } }
         } else if (i === CORRECT) { opt.classList.add('mc-correct'); opt.style.opacity = '0.55'; }
       }
       checkBtn.classList.add('hidden');
       var msg;
       if (selectedIdx === CORRECT) { msg = document.getElementById('msg-correct').textContent; resultArea.style.background = 'rgba(34,197,94,0.12)'; resultArea.classList.add('mc-celebrate'); }
       else { msg = document.getElementById('msg-wrong').textContent; resultArea.style.background = 'rgba(249,115,22,0.1)'; retryBtn.classList.remove('hidden'); }
       resultArea.textContent = msg;
       resultArea.classList.remove('hidden');
       resultArea.classList.add('mc-fade-in');
     }
     function retry() {
       checked = false; selectedIdx = -1;
       for (var i = 0; i < options.length; i++) {
         var opt = options[i];
         opt.classList.remove('mc-selected', 'mc-correct', 'mc-incorrect');
         opt.setAttribute('aria-checked', 'false'); opt.style.opacity = '';
         var cm = opt.querySelector('.mc-check'); var ri = opt.querySelector('.mc-result-icon');
         if (cm) cm.style.display = ''; if (ri) ri.style.display = 'none';
       }
       resultArea.classList.add('hidden'); resultArea.classList.remove('mc-fade-in', 'mc-celebrate'); resultArea.style.background = '';
       retryBtn.classList.add('hidden'); checkBtn.classList.add('hidden');
     }
     for (var i = 0; i < options.length; i++) { (function (idx) {
       options[idx].addEventListener('click', function () { selectOption(idx); });
       options[idx].addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); selectOption(idx); } });
     })(i); }
     checkBtn.addEventListener('click', check); retryBtn.addEventListener('click', retry);
   })();
  </script>
